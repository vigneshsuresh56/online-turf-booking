<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Turfs — TurfBook</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#39e75f;--green2:#2fd154;--dark:#0a0a0a;--card:#141414;--border:#222;--muted:#666;--gold:#FFD700;}
body{background:var(--dark);font-family:'DM Sans',sans-serif;color:#e0e0e0;min-height:100vh;}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 48px;background:#080808;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:200;}
.logo{font-family:'Bebas Neue',sans-serif;font-size:2rem;color:var(--green);letter-spacing:3px;}
nav{display:flex;gap:2px;align-items:center;}
nav a{color:#888;padding:8px 14px;text-decoration:none;border-radius:7px;font-size:.875rem;font-weight:500;transition:color .2s;}
nav a:hover{color:#fff;}
nav a.active{color:var(--green);}
.login-btn{background:var(--green)!important;color:#000!important;font-weight:700!important;margin-left:8px;padding:8px 20px!important;border-radius:7px;}
.page-hero{position:relative;padding:52px 48px 36px;background:linear-gradient(180deg,#0d1a0d,#080808);border-bottom:1px solid #1a2a1a;}
.page-hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 60% 80% at 50% 0%,rgba(57,231,95,.13),transparent 70%);pointer-events:none;}
.page-hero h1{font-family:'Bebas Neue',sans-serif;font-size:3.2rem;color:#fff;letter-spacing:4px;line-height:1;}
.page-hero h1 span{color:var(--green);}
.page-hero p{color:#888;margin-top:8px;font-size:.95rem;}
.hero-stats{display:flex;gap:32px;margin-top:24px;}
.stat-num{font-family:'Bebas Neue',sans-serif;font-size:1.6rem;color:var(--green);}
.stat-lbl{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:1px;}
.filter-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:16px 48px;background:#0d0d0d;border-bottom:1px solid var(--border);position:sticky;top:57px;z-index:150;}
.search-wrap{flex:1;min-width:200px;position:relative;}
.search-wrap input{width:100%;padding:10px 14px 10px 40px;background:#1a1a1a;border:1px solid var(--border);border-radius:9px;color:#fff;font-size:.875rem;outline:none;transition:border-color .2s;font-family:'DM Sans',sans-serif;}
.search-wrap input:focus{border-color:var(--green);}
.search-icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);opacity:.4;pointer-events:none;}
.chips{display:flex;gap:8px;flex-wrap:wrap;}
.chip{padding:7px 16px;border:1px solid var(--border);border-radius:20px;background:transparent;color:#888;cursor:pointer;font-size:.82rem;font-family:'DM Sans',sans-serif;font-weight:500;transition:all .2s;white-space:nowrap;}
.chip:hover{border-color:var(--green);color:var(--green);}
.chip.on{background:var(--green);border-color:var(--green);color:#000;font-weight:700;}
.sort-sel{padding:9px 13px;background:#1a1a1a;border:1px solid var(--border);border-radius:9px;color:#888;font-size:.82rem;cursor:pointer;font-family:'DM Sans',sans-serif;outline:none;}
.sort-sel:focus{border-color:var(--green);}
.result-ct{color:var(--muted);font-size:.82rem;white-space:nowrap;}
.result-ct b{color:var(--green);}
.turfs-wrap{padding:32px 48px 64px;}
.turf-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:22px;}
.turf-card{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;transition:transform .28s,border-color .28s,box-shadow .28s;animation:fadeUp .5s both;}
.turf-card:hover{transform:translateY(-6px);border-color:var(--green);box-shadow:0 16px 48px rgba(57,231,95,.18);}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.card-visual{position:relative;height:180px;overflow:hidden;background:#0a0a0a;}
.card-visual svg{width:100%;height:100%;display:block;transition:transform .4s;}
.turf-card:hover .card-visual svg{transform:scale(1.05);}
.sport-tag{position:absolute;top:11px;left:11px;background:rgba(0,0,0,.72);backdrop-filter:blur(8px);color:var(--green);font-size:.66rem;font-weight:700;padding:4px 10px;border-radius:20px;letter-spacing:1.5px;text-transform:uppercase;border:1px solid rgba(57,231,95,.3);}
.avail-dot{position:absolute;top:11px;right:11px;width:10px;height:10px;border-radius:50%;background:var(--green);box-shadow:0 0 9px var(--green);}
.avail-dot.busy{background:#ff3b3b;box-shadow:0 0 9px #ff3b3b;}
.card-body{padding:14px 16px 16px;}
.card-title{font-family:'Bebas Neue',sans-serif;font-size:1.18rem;color:#fff;letter-spacing:1.5px;margin-bottom:3px;}
.card-loc{color:var(--muted);font-size:.74rem;margin-bottom:9px;}
.stars-row{display:flex;align-items:center;gap:5px;margin-bottom:9px;}
.user-rating-row{display:flex;align-items:center;gap:7px;margin-bottom:12px;padding:7px 9px;background:#1a1a1a;border-radius:8px;}
.user-label{font-size:.7rem;color:var(--muted);flex-shrink:0;}
.user-stars{display:flex;gap:2px;}
.rated-msg{font-size:.7rem;color:var(--green);margin-left:2px;display:none;}
.card-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.card-price{color:var(--green);font-size:1.08rem;font-weight:700;}
.card-price small{color:var(--muted);font-size:.68rem;font-weight:400;}
.card-size{font-size:.7rem;color:#888;background:#1e1e1e;padding:3px 8px;border-radius:5px;border:1px solid #2a2a2a;}
.book-btn{display:block;width:100%;padding:9px;background:var(--green);color:#000;font-weight:700;font-size:.8rem;text-align:center;text-decoration:none;border-radius:9px;letter-spacing:.8px;transition:background .2s,transform .12s;}
.book-btn:hover{background:var(--green2);transform:scale(.98);}
.book-btn.waitlist{background:#2a2a2a;color:#888;border:1px solid #333;}
@media(max-width:768px){header{padding:12px 20px;}.filter-bar,.turfs-wrap{padding-left:20px;padding-right:20px;}.page-hero{padding:36px 20px 28px;}nav a:not(.login-btn){display:none;}}
</style>
</head>
<body>
<header>
  <div class="logo">TurfBook</div>
  <nav>
    <a href="index.html">Home</a>
    <a href="turfs.html" class="active">Turfs</a>
    <a href="booking.html">Booking</a>
    <a href="contact.html">Contact</a>
    <a href="login.html" class="login-btn">Login</a>
  </nav>
</header>
<div class="page-hero">
  <h1>ALL <span>TURFS</span></h1>
  <p>Book the best sports venues across Chennai — instantly</p>
  <div class="hero-stats">
    <div class="stat"><div class="stat-num">100</div><div class="stat-lbl">Venues</div></div>
    <div class="stat"><div class="stat-num">4</div><div class="stat-lbl">Sports</div></div>
    <div class="stat"><div class="stat-num">&#8377;500</div><div class="stat-lbl">Starting</div></div>
    <div class="stat"><div class="stat-num">24/7</div><div class="stat-lbl">Booking</div></div>
  </div>
</div>
<div class="filter-bar">
  <div class="search-wrap">
    <span class="search-icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="22" y2="22"/></svg></span>
    <input type="text" id="searchInput" placeholder="Search turf name or area…" oninput="doFilter()">
  </div>
  <div class="chips">
    <button class="chip on" onclick="setChip('all',this)">All</button>
    <button class="chip" onclick="setChip('football',this)">⚽ Football</button>
    <button class="chip" onclick="setChip('cricket',this)">🏏 Cricket</button>
    <button class="chip" onclick="setChip('box cricket',this)">🟩 Box Cricket</button>
    <button class="chip" onclick="setChip('multi-sport',this)">🏆 Multi-Sport</button>
  </div>
  <select class="sort-sel" onchange="doSort(this.value)">
    <option value="">Sort: Default</option>
    <option value="pl">Price: Low to High</option>
    <option value="ph">Price: High to Low</option>
    <option value="rt">Top Rated</option>
  </select>
  <div class="result-ct">Showing <b id="cnt">100</b> turfs</div>
</div>
<div class="turfs-wrap"><div class="turf-grid" id="grid"></div></div>
<footer style="background:#060606;color:#444;text-align:center;padding:22px;border-top:1px solid #161616;font-size:.82rem;">© 2026 TurfBook — Making sports accessible for everyone</footer>

function makeSVG(sport,id){const s=id%10;if(sport==='football')return svgF(s);if(sport==='cricket')return svgC(s);if(sport==='box cricket')return svgB(s);return svgM(s);}

/* ═══════════════ 100 TURFS DATA ═══════════════ */
const areas=['Anna Nagar','T Nagar','Velachery','Porur','Adyar','Guindy','Tambaram','Chromepet','Nungambakkam','Sholinganallur','OMR','ECR','Perambur','Kodambakkam','Royapettah','Pallavaram','Ambattur','Avadi','Poonamallee','Nanganallur','Thiruvanmiyur','Palavakkam','Virugambakkam','West Mambalam','Medavakkam','Madipakkam','Perungudi','Karapakkam','Kottivakkam','Thoraipakkam','Mylapore','Alwarpet','Egmore','Kilpauk','Chetpet','Saidapet','Alandur','Meenambakkam','Pammal','Selaiyur','Korattur','Padi','Kolathur','Villivakkam','Tondiarpet','Periyamet','Vepery','Choolaimedu','Arumbakkam','Koyambedu'];
const sports=['football','cricket','box cricket','multi-sport'];
const sportEmoji={'football':'⚽','cricket':'🏏','box cricket':'🟩','multi-sport':'🏆'};
const sizes={'football':['5v5','7v7','11v11'],'cricket':['Half Pitch','Full Pitch'],'box cricket':['Box','Mini Box'],'multi-sport':['Full','Large']};
const names=['Green Field','City','Elite','Thunder','Champions','Pro','Night Riders','Smash','Premier','Galaxy','Strike Zone','Powerplay','United Sports','Ace','Red Pitch','Box Blast','Victory','Spin Masters','Turf Kingdom','Flash','Century','Box Masters','Goal Rush','Legends','Sunrise','Grand Slam','Blitz','StrikeForce','Allrounder','Moonlight','Phoenix','Royal','Golden','Silver Star','Diamond','Platinum','Neon','Turbo','Rapid','Swift','Power Play','Super','Mega','Ultra','Alpha','Omega','Nova','Zenith','Peak','Summit','Arena','Ground','Zone','Hub','Club','Sports Park','Field','Pitch','Court','Center'];
const suffixes={'football':['Turf','Ground','Arena','FC','Field','Zone'],'cricket':['Cricket Ground','Cricket Club','Pitch','Cricket Academy','Cricket Hub'],'box cricket':['Box','Box Arena','Box Club','Smash Zone','Power Box'],'multi-sport':['Sports Hub','Arena','Sports Center','Sports Club','Multi Arena']};

function rnd(min,max){return Math.floor(Math.random()*((max-min)+1))+min;}
function rndF(min,max,dec){return parseFloat((Math.random()*(max-min)+min).toFixed(dec));}

// Seeded pseudo-random for consistent data
function seeded(seed,max){return((seed*1103515245+12345)&0x7fffffff)%max;}

const TURFS=Array.from({length:100},(_,i)=>{
  const id=i+1;
  const sport=sports[seeded(id*7,4)];
  const area=areas[seeded(id*13,50)];
  const nameBase=names[seeded(id*17,names.length)];
  const suffix=suffixes[sport][seeded(id*23,suffixes[sport].length)];
  const basePrice={'football':500,'cricket':700,'box cricket':600,'multi-sport':900}[sport];
  const price=basePrice+seeded(id*31,16)*100;
  const rating=parseFloat((3.5+seeded(id*41,16)*0.1).toFixed(1));
  const cnt=50+seeded(id*53,400);
  const avail=seeded(id*67,10)>2;
  const sizeArr=sizes[sport];
  const size=sizeArr[seeded(id*79,sizeArr.length)];
  return{id,name:`${nameBase} ${suffix}`,loc:area,sport,price,size,rating:Math.min(rating,5.0),cnt,avail};
});

/* ═══════════════ STAR WIDGETS ═══════════════ */
function renderStars(rating){
  let h='';
  for(let i=1;i<=5;i++){
    const full=rating>=i,half=!full&&rating>=i-.5;
    const fill=full?'#FFD700':half?'url(#hg)':'#2a2a2a';
    const stk=full||half?'#FFD700':'#3a3a3a';
    h+=`<svg width="13" height="13" viewBox="0 0 24 24"><polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26" fill="${fill}" stroke="${stk}" stroke-width="1"/></svg>`;
  }
  return h;
}
function uStarsHTML(id){
  let h='';
  for(let i=1;i<=5;i++){
    h+=`<svg width="16" height="16" viewBox="0 0 24 24" style="cursor:pointer;transition:transform .12s;" onmouseover="hU(${id},${i})" onmouseout="uhU(${id})" onclick="pU(${id},${i})"><polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26" fill="#2a2a2a" stroke="#3a3a3a" stroke-width="1"/></svg>`;
  }
  return h;
}
function setUStars(id,n,picked){
  const row=document.querySelector(`.us[data-id="${id}"]`);
  if(!row)return;
  [...row.querySelectorAll('svg')].forEach((s,i)=>{
    const p=s.querySelector('polygon');
    const lit=i<n;
    p.setAttribute('fill',lit?'#FFD700':'#2a2a2a');
    p.setAttribute('stroke',lit?'#FFD700':'#3a3a3a');
    s.style.transform=lit?'scale(1.2)':'scale(1)';
  });
}
function hU(id,n){setUStars(id,n,false);}
function uhU(id){const row=document.querySelector(`.us[data-id="${id}"]`);if(!row)return;setUStars(id,parseInt(row.dataset.p||0),true);}
function pU(id,n){
  const row=document.querySelector(`.us[data-id="${id}"]`);
  if(!row)return;
  row.dataset.p=n;
  setUStars(id,n,true);
  const msg=row.parentElement.querySelector('.rm');
  if(msg){msg.style.display='inline';msg.textContent=n===5?'🎉 Amazing!':n>=4?'👍 Great!':n>=3?'😊 Good':n>=2?'😐 Fair':'😞 Poor';}
}

/* ═══════════════ CARD ═══════════════ */
function cardHTML(t,idx){
  return `<div class="turf-card" data-sport="${t.sport}" data-price="${t.price}" data-rating="${t.rating}" style="animation-delay:${(idx%15)*.04}s">
    <div class="card-visual">${makeSVG(t.sport,t.id)}<div class="sport-tag">${t.sport.toUpperCase()}</div><div class="avail-dot ${t.avail?'':'busy'}" title="${t.avail?'Slots available':'Fully booked'}"></div></div>
    <div class="card-body">
      <div class="card-title">${t.name}</div>
      <div class="card-loc">&#128205; ${t.loc}, Chennai</div>
      <div class="stars-row">${renderStars(t.rating)}<span style="font-size:.8rem;font-weight:700;color:#FFD700;margin-left:4px;">${t.rating}</span><span style="font-size:.72rem;color:var(--muted);margin-left:3px;">(${t.cnt})</span></div>
      <div class="user-rating-row">
        <span class="user-label">Rate:</span>
        <div class="us user-stars" data-id="${t.id}" data-p="0">${uStarsHTML(t.id)}</div>
        <span class="rm rated-msg"></span>
      </div>
      <div class="card-meta">
        <div class="card-price">&#8377;${t.price.toLocaleString()} <small>/ Hour</small></div>
        <div class="card-size">${t.size}</div>
      </div>
      <a href="booking.html?turf=${encodeURIComponent(t.name)}" class="book-btn ${t.avail?'':'waitlist'}">${t.avail?'&#9889; BOOK NOW':'&#128203; JOIN WAITLIST'}</a>
    </div>
  </div>`;
}

/* ═══════════════ FILTER / SORT / RENDER ═══════════════ */
let fSport='all',fSort='',fSearch='';
function render(){
  let list=[...TURFS];
  if(fSport!=='all')list=list.filter(t=>t.sport===fSport);
  if(fSearch){const q=fSearch.toLowerCase();list=list.filter(t=>t.name.toLowerCase().includes(q)||t.loc.toLowerCase().includes(q));}
  if(fSort==='pl')list.sort((a,b)=>a.price-b.price);
  else if(fSort==='ph')list.sort((a,b)=>b.price-a.price);
  else if(fSort==='rt')list.sort((a,b)=>b.rating-a.rating);
  document.getElementById('cnt').textContent=list.length;
  const g=document.getElementById('grid');
  if(!list.length){g.innerHTML=`<div style="grid-column:1/-1;text-align:center;padding:80px 20px;color:#444"><div style="font-size:3rem;margin-bottom:14px">&#128269;</div><h3 style="color:#555;margin-bottom:8px">No turfs found</h3><p style="font-size:.9rem">Try adjusting your search or filters</p></div>`;return;}
  g.innerHTML=list.map((t,i)=>cardHTML(t,i)).join('');
}
function setChip(val,el){fSport=val;document.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));el.classList.add('on');render();}
function doFilter(){fSearch=document.getElementById('searchInput').value;render();}
function doSort(v){fSort=v;render();}

render();
