<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login – TurfBook</title>
  <link rel="stylesheet" href="../css/style.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
</head>
<body class="auth-page">

<div class="auth-split">
  <div class="auth-brand-panel">
    <a href="index.html" class="logo large">TURF<span>BOOK</span></a>
    <p class="auth-tagline">Book. Play. Repeat.</p>
    <div class="auth-bg-text">PLAY</div>
  </div>
  <div class="auth-form-panel">
    <div class="auth-form-wrap">
      <h2 class="form-heading">Welcome Back</h2>
      <p class="form-sub">Login to manage your bookings</p>
      <form class="booking-form" onsubmit="handleLogin(event)">
        <div class="form-group"><label>Email</label><input type="email" placeholder="you@email.com" required/></div>
        <div class="form-group"><label>Password</label><input type="password" placeholder="••••••••" required/></div>
        <div class="form-options">
          <label class="remember"><input type="checkbox"/> Remember me</label>
          <a href="#" class="forgot">Forgot password?</a>
        </div>
        <button type="submit" class="btn-primary full-width">Login →</button>
        <p class="auth-switch">Don't have an account? <a href="register.html">Register</a></p>
      </form>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
